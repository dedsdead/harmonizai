<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HarmonizAI - Sem Conexão</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: linear-gradient(135deg, #f5f5f0 0%, #e8e4dc 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }
    
    .container {
      max-width: 400px;
    }
    
    .logo {
      width: 120px;
      height: 120px;
      margin-bottom: 2rem;
    }
    
    h1 {
      color: #722F37;
      font-size: 1.5rem;
      margin-bottom: 1rem;
      font-weight: 600;
    }
    
    p {
      color: #555;
      font-size: 1rem;
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: #722F37;
      color: white;
      padding: 0.75rem 1.5rem;
      border-radius: 9999px;
      text-decoration: none;
      font-weight: 500;
      transition: all 0.2s ease;
      border: none;
      cursor: pointer;
      font-size: 1rem;
    }
    
    .btn:hover {
      background: #5a262e;
      transform: translateY(-1px);
    }
    
    .btn:active {
      transform: translateY(0);
    }
    
    .icon {
      width: 20px;
      height: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <svg class="logo" viewBox="0 0 76 76" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="36" cy="36" r="33.5" fill="#722F37"/>
      <path d="M28.5 6.3h14.8l1.9 7.6 0.7 3.8 1.2 5.7v4.5l-1.2 3.5 -1.6 2.4 -1.9 1.9 -3.5 1.9 -0.9 1.2 -0.9 3.1v17l0.5 3.8 1.2 1.4 2.1 0.9 2.4 0.7v0.9l-6.1 0.2h-3.5l-4.7 -0.2 -0.9 -0.2 0.2 -0.7 4.7 -1.9 1.2 -0.9 0.7 -2.1 0.5 -6.4v-9.2l-0.5 -3.8 -0.7 -2.6 -0.9 -1.2 -3.3 -1.9 -2.4 -2.1 -1.4 -2.1 -0.9 -1.9 -0.5 -2.6v-3.3l2.1 -9.2 1.7 -7.3 0.2 -0.7z" fill="#F4F4D7"/>
    </svg>
    
    <h1>Sem conexão com a internet</h1>
    <p>Verifique sua conexão e tente novamente. O HarmonizAI precisa de internet para consultar nossa base de vinhos e fazer recomendações personalizadas.</p>
    
    <button class="btn" onclick="window.location.reload()">
      <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
      </svg>
      Tentar novamente
    </button>
  </div>
  
  <script>
    // Check for online status change
    window.addEventListener('online', () => {
      window.location.href = '/';
    });
  </script>
</body>
</html>
